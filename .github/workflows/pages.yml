# Build the page with TinyGo and put it on GitHub Pages.
# The repo has no binaries, so llama.cpp is downloaded here.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and let a running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_DIR: build
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'

      - name: Check the WebAssembly code
        run: make check

      # The dev build comes from the last good Linux run on the TinyGo dev branch.
      - name: Install TinyGo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          run=$(gh run list -R tinygo-org/tinygo --workflow linux.yml --branch dev --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          gh run download "$run" -R tinygo-org/tinygo -p 'tinygo_*_amd64.deb' -D tinygo
          sudo dpkg -i tinygo/*/*.deb
          tinygo version

      - name: Build the page
        run: make build

      - name: Upload the artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
