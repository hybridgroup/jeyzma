# Build the page with TinyGo and put it on GitHub Pages.
# The repo has no binaries, so llama.cpp is downloaded here.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and let a running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # The TinyGo dev image has TinyGo, Go, make, git, and curl.
    container: ghcr.io/tinygo-org/tinygo-dev:latest
    env:
      BUILD_DIR: build
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The checkout belongs to another user than the container, so git and Go's VCS stamping refuse it.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check the WebAssembly code
        run: make check

      - name: Show the TinyGo version
        run: tinygo version

      - name: Build the page
        run: make build

      - name: Upload the artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
